version: "3.8"

services:
  jira-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jira_clone_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - MOUSE1_API_KEY=${MOUSE1_API_KEY}
      - DATABASE_URL=file:./dev.db
    volumes:
      - ./dev.db:/app/dev.db

  # Optional PostgreSQL & Redis for large-scale enterprise production:
  # postgres:
  #   image: postgres:16-alpine
  #   container_name: jira_postgres
  #   restart: always
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgrespassword
  #     POSTGRES_DB: jira_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #
  # redis:
  #   image: redis:7-alpine
  #   container_name: jira_redis
  #   restart: always
  #   ports:
  #     - "6379:6379"

volumes:
  pgdata:

